<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rue Bix Queue | Synth-Pop Act</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: rgba(18, 18, 26, 0.7);
            --neon-purple: #b000ff;
            --neon-cyan: #00f0ff;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container { width: 100%; max-width: 800px; text-align: center; }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; letter-spacing: 3px; margin-bottom: 10px; }
        .tagline { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 30px; }

        /* Video Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .video-item {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-item iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .links-container { width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 16px; background: rgba(25, 25, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: var(--text-main); text-decoration: none; font-family: 'Orbitron';
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rue Bix Queue</h1>
        <div class="tagline">Synth-Pop / Neo-Tokyo Soundscapes</div>

        <!-- Video Grid -->
        <div class="video-grid">
            <div class="video-item"><iframe src="https://www.youtube.com/embed/wCzLQqt8RBQ?si=WOSfTEgOSsK-E119" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/QtFzhKtPaJc?si=Ts_2L4TmnCNpy7kz" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/l5TFyTTOY8Q?si=xiRz7aoNi_dv0ooM" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/SPiAznH_Jrg?si=ZTDE48c6YacLj8C5" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/v4MGGbPM0Gk?si=fERrUXQuTOBRA8NR" allowfullscreen></iframe></div>
        </div>

        <!-- Links -->
        <div class="links-container">
            <a href="https://open.spotify.com/artist/0aK1011QLIqiWWn7C0FDXm" class="btn">Listen on Spotify</a>
            <a href="https://music.apple.com/us/artist/rue-bix-queue/1453885497" class="btn">Apple Music</a>
            <a href="https://ruebixqueue.bandcamp.com/music" class="btn">Bandcamp</a>
        </div>
    </div>

</body>
</html>
